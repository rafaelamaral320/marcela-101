<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        const nomeAniversariante = "Marcela"; 
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo da Memória - Marcela</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffdde1 100%);
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; color: #333; overflow-x: hidden;
        }

        .tela-jogo { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100vh; padding: 20px 0; box-sizing: border-box; }
        .cabecalho-jogo { display: flex; justify-content: space-between; align-items: center; width: 95%; max-width: 600px; margin-bottom: 20px; background: rgba(255,255,255,0.7); padding: 10px 20px; border-radius: 30px; box-sizing: border-box; flex-shrink: 0; }
        .cabecalho-jogo h2 { margin: 0; color: #d81b60; font-size: 1.5rem; }
        .btn-voltar { background: #d81b60; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; text-decoration: none; }

        #tabuleiro-memoria { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 92%; max-width: 380px; margin: 0 auto; padding: 10px; perspective: 1000px; 
        }
        .carta { width: 100%; aspect-ratio: 1 / 1; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform 0.6s; }
        .carta.virada { transform: rotateY(180deg); }
        .face { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
        .frente { background-color: #fff; transform: rotateY(180deg); background-size: cover; background-position: center; border: 3px solid #ff4081; }
        .costas { background-color: #ff4081; background-image: radial-gradient(circle, #ff79b0 10%, transparent 10%), radial-gradient(circle, #ff79b0 10%, transparent 10%); background-size: 20px 20px; background-position: 0 0, 10px 10px; color: white; font-size: 2rem; border: 3px solid #d81b60; }
        .carta.encontrada .frente { border-color: #00c853; box-shadow: 0 0 15px rgba(0, 200, 83, 0.6); cursor: zoom-in; }

        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 300; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; animation: fadeIn 0.3s; }
        #lightbox img { max-width: 90%; max-height: 80%; border: 6px solid #fff; border-radius: 15px; box-shadow: 0 0 40px rgba(255, 64, 129, 0.6); object-fit: contain; }
        #lightbox span { color: white; margin-top: 15px; font-size: 1.2rem; opacity: 0.8; }

        #tela-vitoria { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); flex-direction: column; align-items: center; justify-content: center; z-index: 200; animation: fadeIn 1s; }
        #tela-vitoria h2 { color: #d81b60; font-size: 3rem; margin: 0; text-align: center; text-shadow: 2px 2px 0px #ffb2cb; }
        #tela-vitoria p { font-size: 1.3rem; color: #333; text-align: center; padding: 0 20px; }
        .btn-reiniciar { margin-top: 30px; padding: 15px 30px; font-size: 1.2rem; background-color: #d81b60; color: white; border: none; border-radius: 40px; cursor: pointer; font-weight: bold; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="tela-jogo">
        <div class="cabecalho-jogo">
            <h2>Memórias 📸</h2>
            <a href="../index.html" class="btn-voltar">Voltar</a>
        </div>
        <div id="tabuleiro-memoria"></div>
    </div>

    <div id="lightbox" onclick="fecharAmpliador()">
        <img id="imagem-ampliada" src="" alt="Lembrança">
        <span>Toque para fechar</span>
    </div>

    <div id="tela-vitoria">
        <h2>Parabéns, <span id="nome-vitoria"></span>! 🥳</h2>
        <p id="msg-vitoria">Você encontrou todas as lembranças!</p>
        <button class="btn-reiniciar" onclick="iniciarJogoMemoria(); document.getElementById('tela-vitoria').style.display='none';">Jogar de Novo</button>
    </div>

    <script>
        document.getElementById('nome-vitoria').innerText = nomeAniversariante;

        let bancoImagens = [];
        
        async function carregarImagensSequencial() {
            // Nota os "../" para buscar na raiz a partir da pasta games/
            for (let i = 1; i <= 8; i++) bancoImagens.push(`../img/img${i}.jpg`);
            let indexVerificacao = 9;
            while (true) {
                let url = `../img/img${indexVerificacao}.jpg`;
                if (await checarImagemExiste(url)) {
                    bancoImagens.push(url);
                    indexVerificacao++;
                } else break;
            }
        }

        function checarImagemExiste(url) {
            return new Promise((resolve) => {
                let img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        function embaralhar(array) { return array.sort(() => Math.random() - 0.5); }

        let primeiraCarta = null, segundaCarta = null, trancarTabuleiro = false, paresEncontrados = 0;
        let timerLightbox = null;

        async function iniciarJogoMemoria() {
            if (bancoImagens.length === 0) await carregarImagensSequencial();

            const tabuleiro = document.getElementById('tabuleiro-memoria');
            tabuleiro.innerHTML = '';
            paresEncontrados = 0; primeiraCarta = null; segundaCarta = null; trancarTabuleiro = false;
            
            let fotosJogo = embaralhar([...bancoImagens]).slice(0, 8);
            let cartasJogo = embaralhar([...fotosJogo, ...fotosJogo]);

            cartasJogo.forEach(imgSrc => {
                const divCarta = document.createElement('div');
                divCarta.className = 'carta'; divCarta.dataset.imagem = imgSrc;
                const divCostas = document.createElement('div'); divCostas.className = 'face costas'; divCostas.innerText = '🎁';
                const divFrente = document.createElement('div'); divFrente.className = 'face frente'; divFrente.style.backgroundImage = `url('${imgSrc}')`;
                divCarta.appendChild(divCostas); divCarta.appendChild(divFrente);
                divCarta.addEventListener('click', virarCarta);
                tabuleiro.appendChild(divCarta);
            });
        }

        function virarCarta() {
            if (trancarTabuleiro) return;
            if (this.classList.contains('encontrada')) { ampliarImagem(this.dataset.imagem); return; }
            if (this === primeiraCarta) return;
            
            this.classList.add('virada');
            if (!primeiraCarta) { primeiraCarta = this; return; }
            segundaCarta = this;

            if (primeiraCarta.dataset.imagem === segundaCarta.dataset.imagem) {
                primeiraCarta.classList.add('encontrada'); segundaCarta.classList.add('encontrada');
                let imagemCombinada = primeiraCarta.dataset.imagem;
                paresEncontrados++;
                trancarTabuleiro = true; 
                
                setTimeout(() => {
                    ampliarImagem(imagemCombinada);
                    [primeiraCarta, segundaCarta, trancarTabuleiro] = [null, null, false];
                    
                    if (paresEncontrados === 8) {
                        setTimeout(() => {
                            fecharAmpliador();
                            document.getElementById('tela-vitoria').style.display = 'flex';
                        }, 3500); 
                    }
                }, 600);
            } else {
                trancarTabuleiro = true;
                setTimeout(() => {
                    primeiraCarta.classList.remove('virada'); segundaCarta.classList.remove('virada');
                    [primeiraCarta, segundaCarta, trancarTabuleiro] = [null, null, false];
                }, 1000);
            }
        }

        function ampliarImagem(src) {
            const lightbox = document.getElementById('lightbox');
            document.getElementById('imagem-ampliada').src = src;
            lightbox.style.display = 'flex';
            if (timerLightbox) clearTimeout(timerLightbox);
            timerLightbox = setTimeout(fecharAmpliador, 3000);
        }

        function fecharAmpliador() {
            document.getElementById('lightbox').style.display = 'none';
            if (timerLightbox) clearTimeout(timerLightbox);
        }

        window.onload = iniciarJogoMemoria;
    </script>
</body>
</html>
