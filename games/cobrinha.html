<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plantão da Doutora</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #placar {
            color: #ffffff;
            background-color: #0077cc;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 2px solid #ffffff;
            z-index: 10;
        }

        #game-container {
            position: relative;
            width: 95vmin;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px rgba(0, 119, 204, 0.3);
            border: 2px solid #0077cc;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .tela-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(18, 18, 18, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 100;
            cursor: pointer;
        }

        .conteudo-overlay {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
        }

        .titulo-jogo {
            font-size: 2.6rem;
            font-weight: 900;
            color: #ffffff;
            margin: 0 0 10px 0;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
        }

        .subtitulo-vitoria {
            font-size: 2rem;
            font-weight: 900;
            color: #4caf50;
            margin: 5px 0;
            text-shadow: 0 0 15px rgba(76, 175, 80, 0.8), 2px 2px 4px rgba(0,0,0,0.9);
            animation: piscarTexto 1s infinite alternate;
        }

        @keyframes piscarTexto {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }

        .texto-overlay {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-top: 10px;
        }

        .botao-continuar {
            margin-top: 20px;
            background: linear-gradient(45deg, #4caf50, #2e7d32);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.5);
            transition: transform 0.2s;
        }

        .botao-continuar:hover {
            transform: scale(1.05);
        }

        .animar-container {
            animation: entradaEpica 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes entradaEpica {
            0% { transform: scale(0.2); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="placar">Itens: 0 / 13</div>

    <!-- Container do Jogo -->
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <!-- Tela de Início -->
    <div id="tela-inicio" class="tela-overlay" onclick="iniciarJogo()">
        <div class="conteudo-overlay animar-container">
            <div style="font-size: 4rem; margin-bottom: 10px;">👩‍⚕️</div>
            <h1 class="titulo-jogo">PLANTÃO DA DOUTORA</h1>
            <div class="texto-overlay">Colete instrumentos e itens de medicina!<br><br>Toque para iniciar</div>
        </div>
    </div>

    <!-- Tela de Game Over -->
    <div id="tela-gameover" class="tela-overlay" style="display: none;" onclick="iniciarJogo()">
        <div class="conteudo-overlay animar-container">
            <div style="font-size: 4rem; margin-bottom: 10px;">❌</div>
            <h1 class="titulo-jogo" style="color: #ff5252;">FIM DE PLANTÃO</h1>
            <div class="texto-overlay" style="font-size: 1.1rem; font-weight: normal;">
                Toque em qualquer lugar para tentar de novo
            </div>
        </div>
    </div>

    <!-- Tela de Vitória / Meta Atingida -->
    <div id="tela-vitoria" class="tela-overlay" style="display: none;">
        <div class="conteudo-overlay animar-container" onclick="event.stopPropagation()">
            <div style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
            <h1 class="titulo-jogo">META ATINGIDA!</h1>
            <h2 class="subtitulo-vitoria">DOUTORA IMPECÁVEL! ✨</h2>
            <div class="texto-overlay" style="color: #ffeb3b; margin-top: 10px;">
                Você completou 13 itens do plantão!
            </div>
            <button class="botao-continuar" onclick="continuarJogoIndefinidamente()">Continuar Plantão 🚀</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        const telaInicio = document.getElementById("tela-inicio");
        const telaGameOver = document.getElementById("tela-gameover");
        const telaVitoria = document.getElementById("tela-vitoria");
        const placarElemento = document.getElementById("placar");
        const gameContainer = document.getElementById("game-container");

        const tamanhoTile = 20;
        const totalTiles = canvas.width / tamanhoTile;
        const META_VITORIA = 13; 
        
        // Emojis estritamente focados em medicina, saúde, farmácia e equipamentos clínicos
        const itensMedicina = [
            "🩺", "💊", "💉", "🩸", "🧬", "🔬", "🩻", "🩹", "🥼", 
            "🏥", "🌡️", "🧪", "🧫", "🧠", "🫀", "🫁", "🦷", "🦴", 
            "👁️‍🗨️", "🚑", "⚕️", "🦽", "🩼", "📋"
        ];
        
        let cobra = [];
        let direcao = { x: 0, y: 0 };
        let proximaDirecao = { x: 0, y: 0 };
        let itemAtual = { x: 0, y: 0, icone: "🩺" };
        let placar = 0;
        let estadoJogo = "inicio"; 
        let loopJogo;
        let jaExibiuVitoria = false;

        function iniciarJogo() {
            telaInicio.style.display = "none";
            telaGameOver.style.display = "none";
            telaVitoria.style.display = "none";
            gameContainer.style.display = "block";
            placarElemento.style.display = "block";
            
            cobra = [{ x: 10, y: 10 }];
            direcao = { x: 1, y: 0 };
            proximaDirecao = { x: 1, y: 0 };
            placar = 0;
            jaExibiuVitoria = false;
            atualizarPlacar();
            gerarItem();

            estadoJogo = "jogando";
            if(loopJogo) clearInterval(loopJogo);
            loopJogo = setInterval(atualizarJogo, 120); 
        }

        function continuarJogoIndefinidamente() {
            telaVitoria.style.display = "none";
            estadoJogo = "jogando";
            if(loopJogo) clearInterval(loopJogo);
            loopJogo = setInterval(atualizarJogo, 120);
        }

        function gerarItem() {
            itemAtual.x = Math.floor(Math.random() * totalTiles);
            itemAtual.y = Math.floor(Math.random() * totalTiles);
            itemAtual.icone = itensMedicina[Math.floor(Math.random() * itensMedicina.length)];

            for (let parte of cobra) {
                if (parte.x === itemAtual.x && parte.y === itemAtual.y) gerarItem();
            }
        }

        function atualizarPlacar() {
            if (placar < META_VITORIA) {
                placarElemento.innerText = `Itens: ${placar} / ${META_VITORIA}`;
            } else {
                placarElemento.innerText = `Itens: ${placar} (Modo Livre) ✨`;
            }
        }

        function gameOver() {
            estadoJogo = "gameover";
            clearInterval(loopJogo);
            telaGameOver.style.display = "flex";
        }

        function vitoria() {
            estadoJogo = "vitoria";
            clearInterval(loopJogo);
            telaVitoria.style.display = "flex";
        }

        function atualizarJogo() {
            if (estadoJogo !== "jogando") return;

            direcao = proximaDirecao;
            
            const novaCabeca = {
                x: cobra[0].x + direcao.x,
                y: cobra[0].y + direcao.y
            };

            // Colisão com as paredes
            if (novaCabeca.x < 0 || novaCabeca.x >= totalTiles || novaCabeca.y < 0 || novaCabeca.y >= totalTiles) {
                return gameOver();
            }

            // Colisão com o próprio corpo
            for (let parte of cobra) {
                if (novaCabeca.x === parte.x && novaCabeca.y === parte.y) {
                    return gameOver();
                }
            }

            cobra.unshift(novaCabeca); 

            // Pegou o item
            if (novaCabeca.x === itemAtual.x && novaCabeca.y === itemAtual.y) {
                placar++;
                atualizarPlacar();
                
                // Exibe a tela de vitória exatamente ao atingir 13, se ainda não tiver exibido nesta partida
                if (placar === META_VITORIA && !jaExibiuVitoria) {
                    jaExibiuVitoria = true;
                    return vitoria();
                }
                gerarItem();
            } else {
                cobra.pop(); 
            }

            desenharTela();
        }

        function desenharTela() {
            ctx.fillStyle = "#1e1e1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = "16px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.fillText(itemAtual.icone, itemAtual.x * tamanhoTile + 10, itemAtual.y * tamanhoTile + 10);

            for (let i = 0; i < cobra.length; i++) {
                let x = cobra[i].x * tamanhoTile;
                let y = cobra[i].y * tamanhoTile;

                if (i === 0) {
                    ctx.fillText("👩‍⚕️", x + 10, y + 10);
                } else {
                    ctx.fillStyle = "#0077cc"; 
                    ctx.fillRect(x + 2, y + 2, tamanhoTile - 4, tamanhoTile - 4);
                }
            }
        }

        // Controles de teclado
        document.addEventListener("keydown", (e) => {
            if (estadoJogo !== "jogando") return;
            if (e.key === "ArrowUp" && direcao.y === 0) proximaDirecao = { x: 0, y: -1 };
            if (e.key === "ArrowDown" && direcao.y === 0) proximaDirecao = { x: 0, y: 1 };
            if (e.key === "ArrowLeft" && direcao.x === 0) proximaDirecao = { x: -1, y: 0 };
            if (e.key === "ArrowRight" && direcao.x === 0) proximaDirecao = { x: 1, y: 0 };
        });

        // Controles de deslize (Swipe) para mobile
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            if (estadoJogo === "jogando") {
                touchStartX = e.touches[0].screenX;
                touchStartY = e.touches[0].screenY;
            }
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (estadoJogo !== "jogando") return;
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let deltaX = touchEndX - touchStartX;
            let deltaY = touchEndY - touchStartY;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 30 && direcao.x === 0) proximaDirecao = { x: 1, y: 0 }; 
                else if (deltaX < -30 && direcao.x === 0) proximaDirecao = { x: -1, y: 0 }; 
            } else {
                if (deltaY > 30 && direcao.y === 0) proximaDirecao = { x: 0, y: 1 }; 
                else if (deltaY < -30 && direcao.y === 0) proximaDirecao = { x: 0, y: -1 }; 
            }
        }, { passive: true });

        desenharTela();
    </script>
</body>
</html>
