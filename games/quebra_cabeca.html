<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        const nomeAniversariante = "Marcela"; 
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quebra-Cabeça - Marcela</title>
    <style>
        :root {
            --slot-size: 100px;
            --tray-peca-size: 65px;
            --tray-peca-margin: 10px;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffdde1 100%);
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; color: #333; overflow-x: hidden; touch-action: none;
        }

        .tela-jogo { display: flex; position: relative; flex-direction: column; align-items: center; width: 100%; height: 100vh; overflow-y: auto; padding: 20px 0; box-sizing: border-box; }
        .cabecalho-jogo { display: flex; justify-content: space-between; align-items: center; width: 95%; max-width: 600px; margin-bottom: 20px; background: rgba(255,255,255,0.7); padding: 10px 20px; border-radius: 30px; box-sizing: border-box; flex-shrink: 0; }
        .cabecalho-jogo h2 { margin: 0; color: #d81b60; font-size: 1.5rem; }
        .btn-voltar { background: #d81b60; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; text-decoration: none; }

        .painel-centro {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px);
            padding: 30px 20px; border-radius: 30px; box-shadow: 0 20px 50px rgba(216, 27, 96, 0.4);
            text-align: center; max-width: 360px; width: 85%; box-sizing: border-box; margin: auto;
            border: 4px solid #ff79b0;
        }

        .item-jogo {
            background: linear-gradient(45deg, #ff4081, #d81b60, #ff4081); background-size: 200% 200%; color: white;
            padding: 15px 20px; font-size: 1.3rem; border-radius: 50px; cursor: pointer; font-weight: bold;
            box-shadow: 0 5px 15px rgba(216, 27, 96, 0.5); border: none; width: 100%; text-decoration: none; display: block; box-sizing: border-box;
        }

        #container-puzzle { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 350px; gap: 20px; padding-bottom: 40px;}
        
        #puzzle-board {
            display: grid; width: 300px; height: 300px; background: rgba(255,255,255,0.4); border: 4px solid #ff79b0;
            border-radius: 5px; position: relative;
        }

        .puzzle-slot { width: var(--slot-size); height: var(--slot-size); box-sizing: border-box; border: 1px dashed rgba(216, 27, 96, 0.3); }

        #puzzle-tray {
            display: flex; flex-wrap: wrap; justify-content: center; width: 100%;
            min-height: 120px; padding: 15px; background: rgba(255,255,255,0.8); border-radius: 15px; box-sizing: border-box;
        }

        .puzzle-peca {
            width: var(--tray-peca-size); height: var(--tray-peca-size);
            cursor: grab; overflow: visible !important;
            touch-action: none; margin: var(--tray-peca-margin);
        }
        .puzzle-peca:active { cursor: grabbing; opacity: 0.4; }
        .puzzle-peca path { filter: drop-shadow(3px 3px 5px rgba(0,0,0,0.6)); }

        .fantasma-puzzle { 
            position: fixed; pointer-events: none; z-index: 1000; 
            width: var(--slot-size); height: var(--slot-size); margin: 0;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5));
        }

        .puzzle-peca.encaixada { width: var(--slot-size); height: var(--slot-size); margin: 0; cursor: default; pointer-events: none; }
        .puzzle-peca.encaixada path { stroke-width: 0 !important; filter: none; }

        .info-progresso { color: #d81b60; font-weight: bold; font-size: 1.2rem; background: white; padding: 5px 15px; border-radius: 20px; }

        #tela-vitoria { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
        #tela-vitoria h2 { color: #d81b60; font-size: 3rem; margin: 0; text-align: center; text-shadow: 2px 2px 0px #ffb2cb; }
        #tela-vitoria p { font-size: 1.3rem; color: #333; text-align: center; padding: 0 20px; }
        .btn-reiniciar { margin-top: 30px; padding: 15px 30px; font-size: 1.2rem; background-color: #d81b60; color: white; border: none; border-radius: 40px; cursor: pointer; font-weight: bold; }
        
        .escondido { display: none !important; }
    </style>
</head>
<body>

    <!-- TELA 1: SELEÇÃO DE DIFICULDADE -->
    <div id="tela-dificuldade" class="tela-jogo">
        <div class="cabecalho-jogo">
            <h2>Quebra-Cabeça 🖼️</h2>
            <a href="../index.html" class="btn-voltar">Voltar</a>
        </div>
        <div class="painel-centro">
            <h3 style="color:#d81b60; font-size:1.6rem; margin-top:0;">Dificuldade</h3>
            <button class="item-jogo" style="margin-bottom:15px;" onclick="configurarEIniciarPuzzle(3)">Fácil (3x3)</button>
            <button class="item-jogo" style="margin-bottom:15px;" onclick="configurarEIniciarPuzzle(4)">Médio (4x4)</button>
            <button class="item-jogo" onclick="configurarEIniciarPuzzle(5)">Difícil (5x5)</button>
        </div>
    </div>

    <!-- TELA 2: TABULEIRO DO QUEBRA-CABEÇA -->
    <div id="tela-puzzle" class="tela-jogo escondido">
        <div class="cabecalho-jogo">
            <h2>Quebra-Cabeça 🖼️</h2>
            <button class="btn-voltar" onclick="voltarDificuldade()">Voltar</button>
        </div>
        <div id="container-puzzle">
            <span class="info-progresso" id="progresso-puzzle">Foto 1 de 4</span>
            <div id="puzzle-board"></div>
            <div id="puzzle-tray"></div>
        </div>
    </div>

    <!-- MODAL VITÓRIA -->
    <div id="tela-vitoria">
        <h2>Parabéns, <span id="nome-vitoria"></span>! 🥳</h2>
        <p id="msg-vitoria">Você completou o desafio!</p>
        <button class="btn-reiniciar" onclick="voltarDificuldade()">Escolher Dificuldade</button>
    </div>

    <script>
        document.getElementById('nome-vitoria').innerText = nomeAniversariante;

        let bancoImagens = [];
        
        async function carregarImagensSequencial() {
            for (let i = 1; i <= 8; i++) bancoImagens.push(`../img/img${i}.jpg`);
            let indexVerificacao = 9;
            while (true) {
                let url = `../img/img${indexVerificacao}.jpg`;
                if (await checarImagemExiste(url)) {
                    bancoImagens.push(url);
                    indexVerificacao++;
                } else break;
            }
        }

        function checarImagemExiste(url) {
            return new Promise((resolve) => {
                let img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        function embaralhar(array) { return array.sort(() => Math.random() - 0.5); }

        let fotosPuzzle = [], puzzleAtualIndex = 0, pecasPuzzleEncaixadas = 0, gridN = 3;
        let pecaArrastada = null, fantasmaPuzzle = null;

        const configDificuldade = {
            3: { slot: 100, tray: 65, margin: 10 },
            4: { slot: 75, tray: 55, margin: 8 },
            5: { slot: 60, tray: 42, margin: 5 }
        };

        async function configurarEIniciarPuzzle(tamanhoGrid) {
            if (bancoImagens.length === 0) await carregarImagensSequencial();

            gridN = tamanhoGrid;
            const conf = configDificuldade[gridN];
            document.documentElement.style.setProperty('--slot-size', `${conf.slot}px`);
            document.documentElement.style.setProperty('--tray-peca-size', `${conf.tray}px`);
            document.documentElement.style.setProperty('--tray-peca-margin', `${conf.margin}px`);

            document.getElementById('tela-dificuldade').classList.add('escondido');
            document.getElementById('tela-vitoria').style.display = 'none';
            document.getElementById('tela-puzzle').classList.remove('escondido');

            fotosPuzzle = embaralhar([...bancoImagens]).slice(0, 4);
            puzzleAtualIndex = 0;
            montarCenaPuzzle();
        }

        function voltarDificuldade() {
            document.getElementById('tela-puzzle').classList.add('escondido');
            document.getElementById('tela-vitoria').style.display = 'none';
            document.getElementById('tela-dificuldade').classList.remove('escondido');
        }

        function gerarPathJigsaw(top, right, bottom, left) {
            let d = `M 0 0 `;
            if (top === 0) d += `L 100 0 `;
            else if (top === 1) d += `L 35 0 C 30 -25, 70 -25, 65 0 L 100 0 `;
            else if (top === -1) d += `L 35 0 C 30 25, 70 25, 65 0 L 100 0 `;
            if (right === 0) d += `L 100 100 `;
            else if (right === 1) d += `L 100 35 C 125 30, 125 70, 100 65 L 100 100 `;
            else if (right === -1) d += `L 100 35 C 75 30, 75 70, 100 65 L 100 100 `;
            if (bottom === 0) d += `L 0 100 `;
            else if (bottom === 1) d += `L 65 100 C 70 125, 30 125, 35 100 L 0 100 `;
            else if (bottom === -1) d += `L 65 100 C 70 75, 30 75, 35 100 L 0 100 `;
            if (left === 0) d += `L 0 0 Z`;
            else if (left === 1) d += `L 0 65 C -25 70, -25 30, 0 35 L 0 0 Z`;
            else if (left === -1) d += `L 0 65 C 25 70, 25 30, 0 35 L 0 0 Z`;
            return d;
        }

        function montarCenaPuzzle() {
            pecasPuzzleEncaixadas = 0;
            document.getElementById('progresso-puzzle').innerText = `Foto ${puzzleAtualIndex + 1} de 4`;
            
            const board = document.getElementById('puzzle-board');
            const tray = document.getElementById('puzzle-tray');
            board.innerHTML = ''; tray.innerHTML = '';
            
            board.style.gridTemplateColumns = `repeat(${gridN}, 1fr)`;
            board.style.gridTemplateRows = `repeat(${gridN}, 1fr)`;

            let imgSrc = fotosPuzzle[puzzleAtualIndex];

            let R = []; for(let r=0; r<gridN; r++) { let row = []; for(let c=0; c<gridN-1; c++) row.push(Math.random() > 0.5 ? 1 : -1); R.push(row); }
            let B = []; for(let r=0; r<gridN-1; r++) { let row = []; for(let c=0; c<gridN; c++) row.push(Math.random() > 0.5 ? 1 : -1); B.push(row); }

            let pecasGeradas = [];
            let totalPecas = gridN * gridN;

            for (let i = 0; i < totalPecas; i++) {
                let r = Math.floor(i / gridN); let c = i % gridN;
                
                let slot = document.createElement('div');
                slot.className = 'puzzle-slot'; slot.dataset.id = i;
                board.appendChild(slot);

                let top = (r === 0) ? 0 : -B[r-1][c];
                let bottom = (r === gridN - 1) ? 0 : B[r][c];
                let left = (c === 0) ? 0 : -R[r][c-1];
                let right = (c === gridN - 1) ? 0 : R[r][c];
                let pathStr = gerarPathJigsaw(top, right, bottom, left);

                let peca = document.createElement('div');
                peca.innerHTML = `
                    <svg class="puzzle-peca" data-id="${i}" viewBox="0 0 100 100">
                        <defs>
                            <pattern id="pat-${i}" patternUnits="userSpaceOnUse" width="${gridN * 100}" height="${gridN * 100}" x="-${c*100}" y="-${r*100}">
                                <image href="${imgSrc}" width="${gridN * 100}" height="${gridN * 100}" preserveAspectRatio="xMidYMid slice" />
                            </pattern>
                        </defs>
                        <path d="${pathStr}" fill="url(#pat-${i})" stroke="#fff" stroke-width="2" pointer-events="visiblePainted"/>
                    </svg>
                `;
                let svgReal = peca.firstElementChild;
                svgReal.addEventListener('pointerdown', iniciarArrastePuzzle);
                pecasGeradas.push(svgReal);
            }

            embaralhar(pecasGeradas).forEach(p => tray.appendChild(p));
        }

        function iniciarArrastePuzzle(e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            e.preventDefault();

            pecaArrastada = e.target.closest('svg');
            pecaArrastada.style.opacity = '0.4';

            fantasmaPuzzle = pecaArrastada.cloneNode(true);
            fantasmaPuzzle.classList.add('fantasma-puzzle');
            fantasmaPuzzle.style.opacity = '1';
            
            document.body.appendChild(fantasmaPuzzle);
            
            let x = e.clientX !== undefined ? e.clientX : e.touches[0].clientX;
            let y = e.clientY !== undefined ? e.clientY : e.touches[0].clientY;
            
            moverFantasmaPuzzle(x, y);

            window.addEventListener('pointermove', moverArrastePuzzle);
            window.addEventListener('pointerup', soltarArrastePuzzle);
            window.addEventListener('pointercancel', soltarArrastePuzzle);
        }

        function moverFantasmaPuzzle(x, y) {
            if (!fantasmaPuzzle) return;
            let slotTamanhoPx = configDificuldade[gridN].slot;
            fantasmaPuzzle.style.left = `${x - (slotTamanhoPx / 2)}px`; 
            fantasmaPuzzle.style.top = `${y - (slotTamanhoPx / 2)}px`;
        }

        function moverArrastePuzzle(e) {
            let x = e.clientX !== undefined ? e.clientX : e.touches[0].clientX;
            let y = e.clientY !== undefined ? e.clientY : e.touches[0].clientY;
            moverFantasmaPuzzle(x, y); 
        }

        function soltarArrastePuzzle(e) {
            window.removeEventListener('pointermove', moverArrastePuzzle);
            window.removeEventListener('pointerup', soltarArrastePuzzle);
            window.removeEventListener('pointercancel', soltarArrastePuzzle);

            if (!pecaArrastada) return;

            let x = e.clientX;
            let y = e.clientY;
            if (x === undefined && e.changedTouches && e.changedTouches.length > 0) {
                x = e.changedTouches[0].clientX; y = e.changedTouches[0].clientY;
            }

            let slotAlvo = null;
            let todosSlots = document.querySelectorAll('.puzzle-slot');
            todosSlots.forEach(slot => {
                let rect = slot.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    slotAlvo = slot;
                }
            });

            if (slotAlvo && slotAlvo.dataset.id === pecaArrastada.dataset.id) {
                pecaArrastada.classList.add('encaixada');
                pecaArrastada.style.opacity = '1';
                pecaArrastada.removeEventListener('pointerdown', iniciarArrastePuzzle);
                slotAlvo.appendChild(pecaArrastada);
                
                pecasPuzzleEncaixadas++;

                if (pecasPuzzleEncaixadas === (gridN * gridN)) {
                    setTimeout(() => {
                        puzzleAtualIndex++;
                        if (puzzleAtualIndex < 4) {
                            montarCenaPuzzle(); 
                        } else {
                            document.getElementById('msg-vitoria').innerText = "Você montou todos os quebra-cabeças lindamente!";
                            document.getElementById('tela-vitoria').style.display = 'flex';
                        }
                    }, 1200);
                }
            } else {
                pecaArrastada.style.opacity = '1';
            }

            if(fantasmaPuzzle) fantasmaPuzzle.remove();
            fantasmaPuzzle = null; pecaArrastada = null;
        }

        window.onload = async () => {
            await carregarImagensSequencial();
        };
    </script>
</body>
</html>
