<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        const nomeAniversariante = "Marcela"; 
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feliz Aniversário, Marcela!</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffdde1 100%);
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; color: #333; overflow: hidden;
        }

        #fundo-animado, #frente-animada { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
        #fundo-animado { z-index: 0; }
        #frente-animada { z-index: 50; }

        .foto-flutuante {
            position: absolute; width: 110px; height: 110px; background-size: cover; background-position: center;
            border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.25); opacity: 0.6; border: 5px solid white;
        }
        .emoji-animado { position: absolute; pointer-events: none; filter: drop-shadow(2px 5px 8px rgba(0,0,0,0.3)); }
        .fundo-camada-1 { opacity: 0.5; filter: blur(1px); }
        .frente-camada { opacity: 0.95; }

        @keyframes flutuarLento { 0% { transform: translate(0, 0) rotate(-15deg) scale(0.9); } 100% { transform: translate(20px, -30px) rotate(15deg) scale(1.1); } }
        @keyframes pulsoCanto { 0% { transform: scale(1) rotate(-10deg) translate(0, 0); } 50% { transform: scale(1.15) rotate(10deg) translate(5px, -5px); } 100% { transform: scale(1) rotate(-10deg) translate(0, 0); } }

        #menu-principal {
            position: relative; z-index: 10; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px);
            padding: 30px 20px; border-radius: 30px; box-shadow: 0 20px 50px rgba(216, 27, 96, 0.4);
            text-align: center; max-width: 360px; width: 85%; box-sizing: border-box; margin: auto;
            border: 4px solid #ff79b0; animation: entrarMenu 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes entrarMenu { from { transform: scale(0.3) rotate(-10deg); opacity: 0; } to { transform: scale(1) rotate(0deg); opacity: 1; } }
        
        #menu-principal h1 { color: #d81b60; font-size: 2.2rem; margin: 0 0 10px 0; text-shadow: 2px 2px 0px #ffb2cb; animation: pularTexto 2s infinite; }
        @keyframes pularTexto { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-15px) scale(1.05); } 60% { transform: translateY(-8px) scale(1.02); } }
        
        #menu-principal p { font-size: 1.1rem; color: #555; margin-bottom: 25px; font-weight: bold; }
        .lista-jogos { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }

        .item-jogo {
            background: linear-gradient(45deg, #ff4081, #d81b60, #ff4081); background-size: 200% 200%; color: white;
            padding: 15px 20px; font-size: 1.3rem; border-radius: 50px; cursor: pointer; font-weight: bold;
            box-shadow: 0 5px 15px rgba(216, 27, 96, 0.5); transition: transform 0.2s; animation: brilhoBotao 3s ease infinite; border: none; width: 100%;
            text-decoration: none; display: block; box-sizing: border-box;
        }
        .item-jogo:hover { transform: scale(1.05) rotate(2deg); box-shadow: 0 10px 30px rgba(216, 27, 96, 0.8); }
        @keyframes brilhoBotao { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>
<body>

    <div id="fundo-animado"></div>
    <div id="frente-animada"></div>

    <div id="menu-principal">
        <h1 id="titulo-menu">Feliz Aniversário!</h1>
        <p>Escolha o seu presente 🎂🎁</p>
        <ul class="lista-jogos">
            <li><a href="games/jogo_da_memoria.html" class="item-jogo">1. Jogo da Memória 🧩</a></li>
            <li><a href="games/quebra_cabeca.html" class="item-jogo">2. Quebra-Cabeça 🖼️</a></li>
            <li><a href="games/cobrinha.html" class="item-jogo">3. Plantão da Doutora 👩‍⚕️</a></li>
        </ul>
    </div>

    <script>
        document.getElementById('titulo-menu').innerText = `Feliz Aniversário, ${nomeAniversariante}! 🎉`;

        let bancoImagens = [];
        async function carregarImagensSequencial() {
            for (let i = 1; i <= 8; i++) bancoImagens.push(`img/img${i}.jpg`);
            let indexVerificacao = 9;
            while (true) {
                let url = `img/img${indexVerificacao}.jpg`;
                if (await checarImagemExiste(url)) {
                    bancoImagens.push(url);
                    indexVerificacao++;
                } else break;
            }
        }

        function checarImagemExiste(url) {
            return new Promise((resolve) => {
                let img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        function gerarElementosFlutuantes() {
            const fundo = document.getElementById('fundo-animado');
            const frente = document.getElementById('frente-animada');
            fundo.innerHTML = ''; frente.innerHTML = '';
            
            let fotosFundo = bancoImagens.length > 0 ? bancoImagens : ["https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f382.png"];

            for (let i = 0; i < 12; i++) {
                let div = document.createElement('div');
                div.className = 'foto-flutuante fundo-camada-1';
                div.style.backgroundImage = `url('${fotosFundo[i % fotosFundo.length]}')`;
                div.style.left = Math.floor(Math.random() * 85) + 'vw';
                div.style.top = Math.floor(Math.random() * 85) + 'vh';
                div.style.animation = `flutuarLento ${Math.random() * 10 + 15}s ease-in-out infinite alternate`;
                div.style.animationDelay = `-${Math.random() * 20}s`;
                fundo.appendChild(div);
            }

            const emojisDeFesta = ['🥳', '🎉', '🎂', '🎊', '🎈', '💖'];
            for (let i = 0; i < 12; i++) { 
                let div = document.createElement('div');
                div.innerText = emojisDeFesta[Math.floor(Math.random() * emojisDeFesta.length)];
                div.className = 'emoji-animado frente-camada';
                div.style.fontSize = (Math.random() * 2 + 2.5) + 'rem'; 
                
                if (i % 2 === 0) {
                    div.style.left = Math.floor(Math.random() * 25 + 5) + 'vw';
                    div.style.top = Math.floor(Math.random() * 25 + 65) + 'vh';
                } else {
                    div.style.left = Math.floor(Math.random() * 25 + 70) + 'vw';
                    div.style.top = Math.floor(Math.random() * 25 + 5) + 'vh';
                }
                
                div.style.animation = `pulsoCanto ${Math.random() * 3 + 4}s ease-in-out infinite alternate`;
                div.style.animationDelay = `-${Math.random() * 10}s`;
                frente.appendChild(div);
            }
        }

        window.onload = async () => {
            gerarElementosFlutuantes(); 
            await carregarImagensSequencial(); 
            gerarElementosFlutuantes(); 
        };
    </script>
</body>
</html>
